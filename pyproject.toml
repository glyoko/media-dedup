[project]
name = "media-dedup"
version = "0.1.0"
description = "A command line tool for deduplicating media files (images and videos)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]

[project.scripts]
media-dedup = "media_dedup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_dedup"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=media_dedup --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["media_dedup"]
